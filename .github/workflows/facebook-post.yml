name: Facebook scheduled post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print payload without publishing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      post_index:
        description: "Optional post index from posts/posts.json"
        required: false
        type: string
      message:
        description: "Optional one-off message override"
        required: false
        type: string
      link:
        description: "Optional one-off link"
        required: false
        type: string
  schedule:
    # 09:17 JST. GitHub schedule uses UTC and may be delayed under load.
    - cron: "17 0 * * *"

permissions:
  contents: read

concurrency:
  group: facebook-scheduled-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Post to Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v25.0' }}
          POSTS_FILE: posts/posts.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POST_INDEX: ${{ inputs.post_index }}
          POST_TEXT: ${{ inputs.message }}
          POST_LINK: ${{ inputs.link }}
        run: python -m facebook_auto_post
