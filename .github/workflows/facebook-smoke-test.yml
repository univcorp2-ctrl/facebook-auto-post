name: Facebook posting smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest
      - name: Verify dry-run posting command
        env:
          DRY_RUN: "true"
          POST_TEXT: "Facebook auto-post smoke test from GitHub Actions"
          POST_LINK: "https://example.com/facebook-auto-post-smoke-test"
        run: python -m facebook_auto_post
      - name: Check production secrets are configured
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "FB_PAGE_ID or FB_PAGE_ACCESS_TOKEN is not configured. Dry-run is OK, but real posting cannot be verified."
            exit 0
          fi
          echo "Facebook posting secrets are configured. Real posting can be tested by running Facebook scheduled post with dry_run=false."
